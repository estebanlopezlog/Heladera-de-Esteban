<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0891b2">
  <meta name="description" content="Control de inventario y recetas de tu heladera">
  <title>🧊 Mi Heladera</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <div id="app-loading" class="app-loading">
    <div class="app-loading-spinner"></div>
    <p>Cargando tu heladera...</p>
  </div>

  <div id="app-main" style="display:none">
  <div id="app">

    <header class="header">
      <h1>🧊 Mi Heladera</h1>
      <div id="alert-badge" class="alert-badge" style="display:none">0</div>
    </header>

    <nav class="tab-nav">
      <button class="tab-btn active" data-tab="inventory">📋 Inventario</button>
      <button class="tab-btn" data-tab="alerts">🔔 Alertas</button>
      <button class="tab-btn" data-tab="recipes">📖 Recetas</button>
      <button class="tab-btn" data-tab="resumen">📊 Resumen</button>
    </nav>

    <!-- ── Inventario ── -->
    <div id="tab-inventory" class="tab-content">
      <div class="stats-row">
        <div class="stat-card">
          <div id="stat-total" class="stat-number">0</div>
          <div class="stat-label">Productos</div>
        </div>
        <div class="stat-card stat-card--warning">
          <div id="stat-expiring" class="stat-number">0</div>
          <div class="stat-label">Por vencer</div>
        </div>
        <div class="stat-card stat-card--purple">
          <div id="stat-low" class="stat-number">0</div>
          <div class="stat-label">Stock bajo</div>
        </div>
      </div>

      <div class="search-box">
        <input type="text" id="search-input" placeholder="Buscar producto..." autocomplete="off">
      </div>

      <div id="category-filters" class="category-filters"></div>
      <div id="items-list" class="items-list"></div>

      <button id="btn-add" class="btn-fab" title="Agregar producto">+</button>
    </div>

    <!-- ── Alertas ── -->
    <div id="tab-alerts" class="tab-content" style="display:none">
      <div id="alerts-content"></div>
    </div>

    <!-- ── Recetas ── -->
    <div id="tab-recipes" class="tab-content" style="display:none">

      <!-- Vista: lista de recetas -->
      <div id="recipes-list-view">
        <div id="recipes-list" class="recipes-list"></div>
        <button id="btn-add-recipe" class="btn-fab" title="Nueva receta">+</button>
      </div>

      <!-- Vista: verificar receta contra stock -->
      <div id="recipes-check-view" style="display:none">
        <button id="btn-back-recipes" class="btn-back">← Volver</button>
        <div id="recipe-check-content"></div>
      </div>

    </div>

    <!-- ── Resumen ── -->
    <div id="tab-resumen" class="tab-content" style="display:none">
      <div id="resumen-content"></div>
    </div>

  </div><!-- /#app -->

  <!-- ── Modal agregar / editar ── -->
  <div id="modal" class="modal">
    <div id="modal-overlay" class="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-title">Agregar producto</h2>
        <button id="modal-close" class="modal-close" aria-label="Cerrar">✕</button>
      </div>
      <form id="item-form" class="item-form" novalidate>
        <div class="form-group">
          <label for="field-name">Nombre *</label>
          <input type="text" id="field-name" name="name" required
            autocomplete="off" placeholder="ej: Leche entera">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="field-quantity">Cantidad *</label>
            <input type="number" id="field-quantity" name="quantity"
              required min="0" step="any" placeholder="1">
          </div>
          <div class="form-group">
            <label for="field-unit">Unidad</label>
            <select id="field-unit" name="unit">
              <option value="unidades">unidades</option>
              <option value="kg">kg</option>
              <option value="g">g</option>
              <option value="litros">litros</option>
              <option value="ml">ml</option>
              <option value="porciones">porciones</option>
              <option value="fetas">fetas</option>
              <option value="tazas">tazas</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label for="field-category">Categoría</label>
          <select id="field-category" name="category">
            <option value="lacteos">🥛 Lácteos</option>
            <option value="carnes">🥩 Carnes</option>
            <option value="verduras">🥦 Verduras</option>
            <option value="frutas">🍎 Frutas</option>
            <option value="bebidas">🧃 Bebidas</option>
            <option value="condimentos">🧂 Condimentos</option>
            <option value="especias">🌿 Especias</option>
            <option value="fiambres">🍖 Fiambres</option>
            <option value="huevos">🥚 Huevos</option>
            <option value="postres">🍮 Postres</option>
            <option value="otros">📦 Otros</option>
          </select>
        </div>
        <div class="form-group">
          <label for="field-expiry">Fecha de vencimiento</label>
          <input type="date" id="field-expiry" name="expiry">
        </div>
        <div class="form-group">
          <label for="field-min-qty">
            Stock mínimo
            <span class="label-hint">(recibís alerta cuando quede menos)</span>
          </label>
          <input type="number" id="field-min-qty" name="minQty"
            min="0" step="any" placeholder="0">
        </div>
        <div class="form-actions">
          <button type="button" id="btn-cancel" class="btn btn-secondary">Cancelar</button>
          <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ── Modal crear / editar receta ── -->
  <div id="recipe-modal" class="modal">
    <div id="recipe-modal-overlay" class="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="recipe-modal-title">Nueva receta</h2>
        <button id="recipe-modal-close" class="modal-close" aria-label="Cerrar">✕</button>
      </div>
      <form id="recipe-form" class="item-form" novalidate>
        <div class="form-group">
          <label for="recipe-field-name">Nombre de la receta *</label>
          <input type="text" id="recipe-field-name" name="recipeName" required
            autocomplete="off" placeholder="ej: Tortilla de papas">
        </div>
        <div class="form-group">
          <label>Ingredientes *</label>
          <div id="ingredients-container" class="ingredients-container"></div>
          <button type="button" id="btn-add-ingredient" class="btn-add-ingredient">
            + Agregar ingrediente
          </button>
        </div>
        <div class="form-group">
          <label for="recipe-field-servings">
            Rinde (cantidad de platos)
            <span class="label-hint">con las cantidades de ingredientes indicadas arriba</span>
          </label>
          <input type="number" id="recipe-field-servings" name="servings"
            min="1" step="1" placeholder="1">
        </div>
        <div class="form-group">
          <label for="recipe-field-steps">Pasos (opcional)</label>
          <textarea id="recipe-field-steps" name="steps" rows="4"
            placeholder="1. Pelar las papas...&#10;2. Batir los huevos..."></textarea>
        </div>
        <div class="form-group">
          <label for="recipe-field-notes">Notas (opcional)</label>
          <textarea id="recipe-field-notes" name="notes" rows="2"
            placeholder="Instrucciones, tips, sugerencias..."></textarea>
        </div>
        <div class="form-actions">
          <button type="button" id="btn-cancel-recipe" class="btn btn-secondary">Cancelar</button>
          <button type="submit" class="btn btn-primary">Guardar receta</button>
        </div>
      </form>
    </div>
  </div>

  </div><!-- /#app-main -->

  <div id="toast-container"></div>

  <script src="app.js?v=6"></script>
</body>
</html>
